<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>兑换高仿USDT(TRC20)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>兑换高仿USDT(TRC20)</h1>
        </div>

        <div class="exchange-box">
            <div class="input-group">
                <label for="usdt-amount">USDT数量</label>
                <div class="input-wrapper">
                    <input type="number" id="usdt-amount" placeholder="请输入USDT数量（最低200）" step="any" min="0">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png" alt="USDT Logo" class="input-icon">
                </div>
            </div>
            <div class="input-group">
                <label for="received-amount">收到的USDT数量</label>
                <div class="input-wrapper">
                    <input type="text" id="received-amount" readonly placeholder="0">
                    <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/825.png" alt="USDT Logo" class="input-icon">
                </div>
            </div>
            <div class="input-group">
                <label for="receive-address">接收地址</label>
                <div class="input-wrapper">
                    <input type="text" id="receive-address" placeholder="请输入TRC20接收地址">
                </div>
            </div>
            <p class="exchange-rate">兑换比例: 1 USDT = 1000 高仿USDT</p>
            <button id="exchange-btn" disabled>兑换</button>
        </div>

        <div class="network-info">
            <p>本兑换基于TRC20网络，兼容所有支持TRC20的钱包（如TronLink、MetaMask等）。</p>
        </div>

        <div class="support">
            客服TG: <a href="https://t.me/AF3080" target="_blank">AF3080</a>
        </div>
    </div>

    <script src="https://unpkg.com/@tronweb/tronweb@4.3.0/dist/tronweb.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
