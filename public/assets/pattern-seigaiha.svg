<svg xmlns="http://www.w3.org/2000/svg" width="96" height="48" viewBox="0 0 96 48">
  <!-- 青海波 seigaiha in gold hairline over rice-paper fibre; tile seamlessly -->
  <defs>
    <filter id="f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .58 0 0 0 0 .48 0 0 0 0 .3 0 0 0 .14 0"/></filter>
  </defs>
  <rect width="96" height="48" fill="#F6F0E4"/>
  <g fill="#F6F0E4" stroke="#C59B4F" stroke-width=".9" stroke-opacity=".55">
    <g id="s"><circle cx="0" cy="0" r="24"/><circle cx="0" cy="0" r="18"/><circle cx="0" cy="0" r="12"/><circle cx="0" cy="0" r="6" fill="#DDEBE2"/></g>
    <use href="#s" x="48"/><use href="#s" x="96"/>
    <use href="#s" x="24" y="24"/><use href="#s" x="72" y="24"/>
    <use href="#s" x="0" y="48"/><use href="#s" x="48" y="48"/><use href="#s" x="96" y="48"/>
  </g>
  <rect width="96" height="48" filter="url(#f)"/>
</svg>
