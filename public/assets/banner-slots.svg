<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="750" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/><stop offset=".55" stop-color="#F3ECDD"/><stop offset="1" stop-color="#E3EEE5"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCEFD3"/><stop offset=".55" stop-color="#F6E1BC"/><stop offset="1" stop-color="#EAD6B0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFF8E6"/><stop offset=".6" stop-color="#F2D79A"/><stop offset="1" stop-color="#E4BE72"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9DFD1"/><stop offset="1" stop-color="#A9CDBB"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB49E"/><stop offset="1" stop-color="#4F977F"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7D68"/><stop offset="1" stop-color="#1F5E4E"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBE1"/><stop offset="1" stop-color="#B9D6C6"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA88D"/><stop offset=".3" stop-color="#2F7D68"/><stop offset=".7" stop-color="#1F5E4E"/><stop offset="1" stop-color="#2A7360"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5E6BE"/><stop offset=".3" stop-color="#D9B46C"/><stop offset=".55" stop-color="#B88A3E"/><stop offset=".8" stop-color="#E8D3A0"/><stop offset="1" stop-color="#A97C36"/>
    </linearGradient>
    <radialGradient id="bi" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#9BD0B8"/><stop offset=".45" stop-color="#4F977F"/><stop offset="1" stop-color="#1F5E4E"/>
    </radialGradient>
    <linearGradient id="cin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D35C45"/><stop offset="1" stop-color="#9A3424"/></linearGradient>
    <clipPath id="gate"><circle cx="548" cy="178" r="138"/></clipPath>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .28  0 0 0 .16 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="wave" width="40" height="20" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#C59B4F" stroke-width=".8" opacity=".35">
        <path d="M0 20a20 20 0 0 1 40 0M6 20a14 14 0 0 1 28 0M12 20a8 8 0 0 1 16 0"/>
        <path d="M-20 10a20 20 0 0 1 40 0M20 10a20 20 0 0 1 40 0M-14 10a14 14 0 0 1 28 0M26 10a14 14 0 0 1 28 0M-8 10a8 8 0 0 1 16 0M32 10a8 8 0 0 1 16 0"/>
      </g>
    </pattern>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity=".9"/></linearGradient>
    <mask id="waveMask"><rect width="750" height="320" fill="url(#fadeL)"/></mask>
    <symbol id="cloud" viewBox="0 0 120 44">
      <path d="M8 38h96c8 0 12-6 10-12-2-7-10-9-15-6 1-9-7-16-16-14-3-7-13-10-20-5-6-6-18-4-21 5-8-2-16 4-15 12-8 0-13 5-13 10 0 6 4 10 12 10z" fill="#FBF8F1" stroke="url(#gold)" stroke-width="2"/>
      <path d="M44 22c0-5 6-7 9-4 3 3 0 8-4 7M70 18c2-4 8-4 10 0 2 4-2 8-6 6M28 30c-1-4 3-7 7-5" fill="none" stroke="#C59B4F" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="blossom" viewBox="-10 -10 20 20">
      <g fill="url(#cin)"><circle cx="0" cy="-5" r="4"/><circle cx="4.8" cy="-1.5" r="4"/><circle cx="3" cy="4" r="4"/><circle cx="-3" cy="4" r="4"/><circle cx="-4.8" cy="-1.5" r="4"/></g>
      <circle r="2.2" fill="#F5E6BE"/>
    </symbol>
  
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E9A80"/><stop offset=".6" stop-color="#1F5E4E"/><stop offset="1" stop-color="#173F35"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDEBE2"/><stop offset=".45" stop-color="#A9CDBB"/><stop offset="1" stop-color="#4F977F"/></linearGradient>
    <radialGradient id="moon" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFDF7"/><stop offset=".7" stop-color="#F3ECDD"/><stop offset="1" stop-color="#E8D3A0"/></radialGradient>
  </defs>

  <!-- paper ground -->
  <rect width="750" height="320" fill="url(#sky)"/>
  <rect width="750" height="320" fill="url(#wave)" mask="url(#waveMask)"/>
  <ellipse cx="560" cy="300" rx="260" ry="30" fill="#A9CDBB" opacity=".35" filter="url(#soft)"/>

  <!-- moon-gate interior (variant) -->
  <g clip-path="url(#gate)">
<rect x="400" y="30" width="300" height="300" fill="url(#dusk)"/>
    <circle cx="610" cy="100" r="34" fill="url(#sun)"/><circle cx="610" cy="100" r="50" fill="#F2D79A" opacity=".22"/>
    <path d="M400 214c30-30 58-48 86-40 22-34 48-52 72-30 18-16 46-24 70-4 24-10 50 4 72 30V330H400z" fill="url(#m1)"/>
    <path d="M400 238c34-22 62-28 90-12 26-30 56-36 82-12 26-14 58-14 88 6 14-4 28 0 40 8V330H400z" fill="url(#m2)"/>
    <rect x="400" y="276" width="300" height="60" fill="url(#water)"/>
    <g fill="none" stroke="#C59B4F" stroke-width="1.4" stroke-linecap="round" opacity=".7"><path d="M430 290h40M600 300h56M470 312h70"/></g>
    <ellipse cx="552" cy="290" rx="86" ry="14" fill="#173F35" opacity="0.32" filter="url(#soft)"/><svg x="462" y="104" width="186" height="186" viewBox="0 0 48 48" overflow="visible"><defs><linearGradient id="slj" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DB397"/><stop offset=".45" stop-color="#2F7D68"/><stop offset="1" stop-color="#1A4E41"/></linearGradient><linearGradient id="slau" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E6BE"/><stop offset=".4" stop-color="#C9A055"/><stop offset=".7" stop-color="#9C7432"/><stop offset="1" stop-color="#E8D3A0"/></linearGradient><linearGradient id="slc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9604A"/><stop offset="1" stop-color="#9A3424"/></linearGradient><radialGradient id="sliv" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#FFFDF7"/><stop offset="1" stop-color="#EADFC8"/></radialGradient></defs>
<rect x="5" y="8" width="33" height="34" rx="9" fill="url(#slj)" stroke="url(#slau)" stroke-width="1.6"/>
<path d="M9 14a6 6 0 0 1 6-4h12" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" fill="none"/>
<rect x="9.5" y="16" width="24" height="15" rx="4" fill="url(#sliv)" stroke="url(#slau)" stroke-width="1.2"/>
<path d="M17.5 16v15M25.5 16v15" stroke="#C9A055" stroke-width="1"/>
<g fill="url(#slc)"><circle cx="13.5" cy="23.5" r="2.6"/><circle cx="21.5" cy="23.5" r="2.6"/><circle cx="29.5" cy="23.5" r="2.6"/></g>
<rect x="13" y="35" width="17" height="3" rx="1.5" fill="url(#slau)"/>
<path d="M38 28h3.5V14" fill="none" stroke="url(#slau)" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="41.5" cy="11.5" r="3.6" fill="url(#slc)" stroke="url(#slau)" stroke-width="1.2"/>
</svg><g transform="translate(498 300) rotate(-14)"><ellipse rx="15" ry="13.8" fill="url(#gold)" stroke="#8F6A2E" stroke-width="1"/><rect x="-4.5" y="-4.5" width="9" height="9" fill="none" stroke="#8F6A2E" stroke-width="1.2" opacity=".8"/></g><g transform="translate(522 314) rotate(10)"><ellipse rx="12" ry="11.04" fill="url(#gold)" stroke="#8F6A2E" stroke-width="1"/><rect x="-3.6" y="-3.6" width="7.2" height="7.2" fill="none" stroke="#8F6A2E" stroke-width="1.2" opacity=".8"/></g><g transform="translate(612 304) rotate(18)"><ellipse rx="14" ry="12.88" fill="url(#gold)" stroke="#8F6A2E" stroke-width="1"/><rect x="-4.2" y="-4.2" width="8.4" height="8.4" fill="none" stroke="#8F6A2E" stroke-width="1.2" opacity=".8"/></g><g transform="translate(634 316) rotate(-6)"><ellipse rx="10" ry="9.2" fill="url(#gold)" stroke="#8F6A2E" stroke-width="1"/><rect x="-3" y="-3" width="6" height="6" fill="none" stroke="#8F6A2E" stroke-width="1.2" opacity=".8"/></g>
  </g>

  <!-- the gate ring: jade lacquer with gold inlay -->
  <circle cx="548" cy="178" r="150" fill="none" stroke="#173F35" stroke-opacity=".18" stroke-width="30" transform="translate(4 8)" filter="url(#soft)"/>
  <circle cx="548" cy="178" r="150" fill="none" stroke="url(#ring)" stroke-width="24"/>
  <circle cx="548" cy="178" r="163" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
  <circle cx="548" cy="178" r="137" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <path d="M430 92a150 150 0 0 1 150-62" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  <path d="M414 128a150 150 0 0 1 8-20" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <g fill="url(#gold)">
    <circle cx="548" cy="28" r="5"/><circle cx="398" cy="178" r="5"/><circle cx="698" cy="178" r="5"/>
  </g>

  <!-- plum branch crossing the gate -->
  <g>
    <path d="M750 40c-40 6-70 22-96 46-18 16-34 22-56 24M672 70c6-18 4-30-6-42M626 98c-4 12-14 20-28 24" fill="none" stroke="#5B3A22" stroke-width="5" stroke-linecap="round"/>
    <path d="M750 40c-40 6-70 22-96 46" fill="none" stroke="#8A5B37" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <use href="#blossom" x="590" y="98" width="22" height="22"/>
    <use href="#blossom" x="660" y="22" width="20" height="20"/>
    <use href="#blossom" x="636" y="80" width="16" height="16"/>
    <use href="#blossom" x="700" y="48" width="24" height="24"/>
    <use href="#blossom" x="590" y="118" width="14" height="14"/>
    <circle cx="612" cy="88" r="3" fill="#D9775F"/><circle cx="684" cy="60" r="2.6" fill="#D9775F"/>
  </g>

  <!-- floating jade bi disc -->
  <g transform="translate(408 246)">
    <ellipse cx="6" cy="40" rx="40" ry="8" fill="#1F5E4E" opacity=".18" filter="url(#soft)"/>
    <circle r="40" fill="url(#bi)"/>
    <circle r="40" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="14" fill="#F3ECDD" stroke="url(#gold)" stroke-width="2.5"/>
    <g fill="none" stroke="#E8D3A0" stroke-width="1.1" opacity=".7">
      <circle r="26"/><circle r="33" stroke-dasharray="2 4"/>
    </g>
    <path d="M-30-16a34 34 0 0 1 24-20" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- clouds -->
  <use href="#cloud" x="652" y="214" width="96" height="36"/>
  <use href="#cloud" x="318" y="56" width="70" height="26" opacity=".9"/>

  <!-- cinnabar seal -->
  <g transform="translate(700 268) rotate(-4)">
    <rect x="-22" y="-22" width="44" height="44" rx="5" fill="url(#cin)"/>
    <rect x="-18" y="-18" width="36" height="36" rx="3" fill="none" stroke="#F6E6D0" stroke-width="1.4"/>
    <text x="0" y="7" text-anchor="middle" font-family="Cinzel,Marcellus,Georgia,serif" font-weight="700" font-size="19" fill="#FBEFDF">8K</text>
  </g>

  <!-- gold sparkles -->
  <g fill="#D9B46C">
    <path d="M360 140l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/><path d="M714 120l1.5 5 5 1.5-5 1.5-1.5 5-1.5-5-5-1.5 5-1.5z"/>
    <path d="M300 250l1.5 5 5 1.5-5 1.5-1.5 5-1.5-5-5-1.5 5-1.5z" opacity=".7"/>
  </g>
  <rect width="750" height="320" fill="#fff" filter="url(#paper)"/>
</svg>
