<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B1B5E"><meta name="color-scheme" content="light">
<title>8K｜体育博彩（演示）</title>
<link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/art.css">
<script src="/js/boot.js"></script></head>
<body>
<div class="hdr-ph" aria-hidden="true"></div>
<section class="sp-hero"><div class="bg" aria-hidden="true"></div><div class="wrap">
  <span class="eyebrow">SPORTS</span> <span class="demo-tag" style="margin-left:6px">示例赔率</span>
  <h1>体育博彩 <em>· 赛事与赔率</em></h1>
</div></section>
<div class="ctl"><div class="wrap"><div class="tabs" id="sp-tabs" role="tablist" aria-label="体育项目" style="margin-bottom:0"></div></div></div>
<main class="lob-main" style="padding-top:0"><div class="wrap sp-wrap">
  <div><div class="sp-list" id="list" aria-busy="true"><div class="skel" style="aspect-ratio:2/1"></div><div class="skel" style="aspect-ratio:2/1"></div></div>
  <p style="font-size:12px;color:rgba(255,255,255,.7);padding-bottom:20px">全部赛事、队伍与赔率均为<b>示例/演示</b>数据；赔率每 8 秒在 live 场次随机波动，用于演示“赔率变动确认”。</p></div>
  <aside class="slip-side" id="sideSlip" aria-label="投注单"></aside>
</div></main>
<div class="slipbar" id="slipbar" hidden><button class="btn btn-foil" id="slipOpen" type="button"><span>投注单 <b id="sn">0</b></span><span id="so">--</span></button></div>
<script nomodule src="/js/nomodule.js"></script>
<script type="module" src="/js/sports.js"></script>
</body></html>
