# Render Blueprint —— 免费 Web 服务（前端 + 后端同一个 Node 容器）
# 用法见 DEPLOY.md。⚠ 本文件只做部署准备，尚未部署。
services:
  - type: web
    name: 8k-platform
    runtime: docker           # 使用仓库根目录的 Dockerfile（也可改成 runtime: node，见 DEPLOY.md）
    dockerfilePath: ./Dockerfile
    plan: free                # 免费实例：闲置 15 分钟休眠、冷启动约 1 分钟、磁盘临时（重启/休眠/重新部署后数据重置）
    region: singapore         # 离国内/东南亚用户较近；可改 oregon / frankfurt 等
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render 会自动注入 PORT（默认 10000），服务读取 PORT，无需设置。
      - key: TRUST_PROXY       # 在 Render 反向代理之后：按 X-Forwarded-For 取真实 IP（限流/登录锁定需要）
        value: "1"
      - key: DATA_DIR          # JSON 文件持久化目录。免费实例磁盘是临时的 → 休眠/重启后重置
        value: /app/data
      - key: HUIDU_SIMULATOR   # 默认使用内置 HUIDU 模拟器（无需任何真实凭据）
        value: "on"
      - key: SIGNATURE_MODE
        value: enforce
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD    # 由 Render 随机生成（Dashboard → Environment 里查看），避免把演示默认密码暴露到公网；也可在 Dashboard 改成自己的
        generateValue: true
      # PUBLIC_BASE_URL 可不设：服务会按 Host / X-Forwarded-Proto 推断自己的地址（需要固定域名时再加）。
      # --- 以下为可选，默认不设 ---
      # - key: DEMO_PLAYER_PASSWORD   # 不设 = 演示玩家 test01/02/03 使用默认密码 Test@2026（登录页会显示演示账号提示）
      #   sync: false
      # - key: SEED_DEMO              # 设为 "0" = 不创建演示玩家
      #   value: "0"
      # - key: HUIDU_BASE_URL / HUIDU_AGENCY_UID / HUIDU_AES_KEY   # 接真实 HUIDU 时在 Dashboard 里填（切勿提交到仓库）
